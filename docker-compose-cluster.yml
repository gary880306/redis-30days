# Day 18 Cluster：三主三從，六台都開 cluster 模式
name: day18

services:
  net: # 只負責開網路跟 port，其他台都借它的網路
    image: redis:7-alpine
    container_name: day18-net
    command: sleep infinity
    init: true # 讓 docker stop 不用等 10 秒
    ports:
      - "7001-7006:7001-7006" # 六台 Redis

  redis-7001:
    image: redis:7-alpine
    container_name: redis-7001
    network_mode: service:net
    command: redis-server --port 7001 --cluster-enabled yes # 開 cluster 模式

  redis-7002:
    image: redis:7-alpine
    container_name: redis-7002
    network_mode: service:net
    command: redis-server --port 7002 --cluster-enabled yes

  redis-7003:
    image: redis:7-alpine
    container_name: redis-7003
    network_mode: service:net
    command: redis-server --port 7003 --cluster-enabled yes

  redis-7004:
    image: redis:7-alpine
    container_name: redis-7004
    network_mode: service:net
    command: redis-server --port 7004 --cluster-enabled yes

  redis-7005:
    image: redis:7-alpine
    container_name: redis-7005
    network_mode: service:net
    command: redis-server --port 7005 --cluster-enabled yes

  redis-7006:
    image: redis:7-alpine
    container_name: redis-7006
    network_mode: service:net
    command: redis-server --port 7006 --cluster-enabled yes
