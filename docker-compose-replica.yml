# Day 16 主從複製：一主一從，跟 Day 2 的 redis30days 分開跑
name: day16 # 網路會叫 day16_default

services:
  redis-master:
    image: redis:7-alpine
    container_name: redis-master

  redis-replica:
    image: redis:7-alpine
    container_name: redis-replica
    command: redis-server --replicaof redis-master 6379 # 當 redis-master 的從節點
